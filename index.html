<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopy</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/landing page/hero.css">
    <link rel="stylesheet" href="css/landing page/featured.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo-header-div">
                <img src="assets/images/logo.png" alt="Shopy Logo">
            </div>
            <nav>
                <ul>
                    <li>Products</li>
                    <li>Orders</li>
                    <li>About</li>
                    <li>Contact</li>           
                </ul>
            </nav>
            <div class="button-header">
                <button class="white-button">Log in</button>
                <button class="black-button">Sign up</button>
            </div>
        </div>
    </header>

    <section class="hero-section">
        <div class="abs-hero headphone"><img src="assets/images/headphone.png" alt="Headphone"></div>
        <div class="abs-hero perfume"><img src="assets/images/perfume.png" alt="Perfume"></div>
        <div class="hero-container">
                <div class="users-hero">
                    <img src="assets/images/users-group.svg" alt="Group of Users">
                    <div class="stars-hero-users">
                        <img src="assets/images/5-stars.png" alt="5 Stars">
                        <h3>230k+ <span>Happy Customers</span></h3>
                    </div>
                </div>
                <h2>Everything You Need, All in <span>One Place.</span></h2>
                <p>Discover quality products all in one place. Shop with confidence and enjoy a seamless shopping experience.</p>
                <div class="hero-button-div">
                    <button class="black-button hero-button">Shop Now</button>
                </div>
        </div>
    </section>

    <section class="featured-section">
        <div class="featured-container">
            <div class="featured-header">
                <h2>Featured Products</h2>
                <p>Explore our best-selling products.</p>
            </div>
            <div>
                <div class="categories-div">
                    <button class="arrow arrow-right"><img src="assets/images/right-chevron.png" alt="Right Chevron"></button>
                    <button class="arrow arrow-left"><img src="assets/images/left-chevron.png" alt="Right Chevron"></button>
                    <div class="gred-category"></div>
                    <div class="categories"></div>
                </div>
                <div></div>
            </div>
        </div>
    </section>

    <div class="c"></div>

    <script src="js/header.js"></script>
    <script src="js/featured.js"></script>
</body>
</html>
